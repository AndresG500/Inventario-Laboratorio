services:
  postgres:
    image: postgres:17
    container_name: database-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_LISTEN_PORT}:${PGADMIN_LISTEN_PORT}"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_LISTEN_PORT}
    restart: unless-stopped

  # Backend: proyecto Django (carpeta Backend/)
  web:
    build: ./Backend
    container_name: django
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    # En local se usa el servidor de desarrollo (recarga solo al editar); en Render, iniciar.sh.
    command: python3 manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Front: proyecto Astro (carpeta Front/)
  frontend:
    build: ./Front
    container_name: astro
    depends_on:
      - web
    environment:
      # Dentro de la red de Docker, Django se alcanza por el nombre del servicio
      DJANGO_API_URL: http://web:8000
    volumes:
      - ./Front:/app
      # Evita que el volumen de arriba tape los node_modules instalados en la imagen
      - /app/node_modules
    ports:
      - "4321:4321"
    restart: unless-stopped

# Nombres fijos: se reutilizan los volúmenes que ya existían, así no se pierden los datos.
volumes:
  postgres_data:
    name: inventario_postgres_data
  pgadmin_data:
    name: inventario_pgadmin_data
